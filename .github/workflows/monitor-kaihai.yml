name: 开开实业盘中关键位提醒

# 纯云端(GitHub Actions)执行, 电脑关机也能收提醒。
# 仅在 9:00-10:00 北京时间窗口定时拉起开开实业 600272 实时价,
# 触及关键位(止损17.45/买点18.30/目标19.60/浮亏超10%/异动≥7%)时 PushPlus 推微信, 其余静默。

on:
  schedule:
    # UTC = 北京时间 - 8 ; 覆盖 9:00 9:10 9:20 9:30 9:45 10:00
    - cron: '0 1 * * 1-5'      # 09:00
    - cron: '10 1 * * 1-5'     # 09:10
    - cron: '20 1 * * 1-5'     # 09:20
    - cron: '30 1 * * 1-5'     # 09:30
    - cron: '45 1 * * 1-5'     # 09:45
    - cron: '0 2 * * 1-5'      # 10:00
  workflow_dispatch:           # 手动触发(测试/补发)
    inputs:
      test:
        description: '测试模式: 无论窗口/触发与否都发一条快照到微信'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: kaihai-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      FORCE_SEND: ${{ github.event.inputs.test }}
    steps:
      - uses: actions/checkout@v5

      - name: 运行开开关键位监控
        run: python scripts/monitor_kaihai.py
